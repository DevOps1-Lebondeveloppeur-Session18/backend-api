name: frontend pipeline 
env: 
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/front-session18

on:
  push:
    branches: main 

jobs:
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: clone repo
              uses: actions/checkout@v7

            - name: install dep
              run: npm i

            - name: test
              run: npm run test

        sonarQube-test:
         runs-on: ubuntu-latest
    steps:
      - name: Clone Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}    

# Docker Image Scanning (Trivy) 
trivy-image-security-scan-job: 
runs-on: ubuntu-latest 
needs: 
        - sonarQube-test
        - unit-test
        
steps:     
  - name: Checkout Code 
    uses: actions/checkout@v4 
  - name: Install dependencies 
    run: sudo apt-get update && sudo apt-get install -y curl  
  - name: Download and install Trivy 
    run: |
     curl -sSL https://github.com/aquasecurity/trivy/releases/download/v0.74.0/trivy_0.74.0_Linux-32bit.
     tar.gz -o trivy.tar.gz 
     tar xzvf trivy.tar.gz 
     sudo mv trivy /usr/local/bin/ 
     trivy --version
  - name: Run Trivy Docker image vulnerability scan 
    run: | 
          docker build -t ${{ env.IMAGE_NAME }} . 
          trivy image ${{ env.IMAGE_NAME }} 

    # Build docker image
    build-docker-image:
        runs-on: ubuntu-latest
        needs: 
        - unit-test
        - sonarQube-test 

        steps:
          - name: clone repo
            uses: actions/checkout@v7

          - name: build image
            run: docker build -t ${{env.IMAGE_NAME}}:v${{github.run_number}} .

          - name: tag latest image
            run: docker tag ${{env.IMAGE_NAME}}:v${{github.run_number}} ${{env.IMAGE_NAME}}:latest

          - name: check image
            run: docker images

          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: push image
            run: docker push ${{env.IMAGE_NAME}}:v${{github.run_number}}

          - name: push latest image
            run: docker push ${{env.IMAGE_NAME}}:latest

    # deploy
    deploy:
        runs-on: ubuntu-latest
        needs: build-docker-image
        steps:
          - name: Execute remote SSH commands using password
            uses: appleboy/ssh-action@v1
            with:
              host: ${{ secrets.VPS_HOST }}
              username: ${{ secrets.VPS_USERNAME }}
              password: ${{ secrets.VPS_PASSWORD }}
              script: |
                cd /home/user/devops-script/fronend
                sudo docker compose up -d --force-recreate --pull always backend-api