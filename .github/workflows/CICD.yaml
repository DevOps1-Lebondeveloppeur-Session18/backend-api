name: frontend pipeline
env: 
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/front-session18

on:
  push:
    branches: main 

jobs:
    unit-test:
        runs-on: ubuntu-latest
        steps:
            - name: clone repo
              uses: actions/checkout@v7

            - name: install dep
              run: npm i

            - name: test
              run: npm run test

            - name: Slack Notification
              uses: rtCamp/action-slack-notify@v2
              env:
                SLACK_CHANNEL: general
                SLACK_COLOR: ${{ job.status }} # or a specific color like 'good' or '#ff00ff'
                SLACK_ICON: https://github.com/rtCamp.png?size=48
                SLACK_MESSAGE: 'Post Content :rocket:'
                SLACK_TITLE: Post Title
                SLACK_USERNAME: rtCamp
                SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}

    # Build docker image
    build-docker-image:
        runs-on: ubuntu-latest
        needs: unit-test
        steps:
          - name: clone repo
            uses: actions/checkout@v7

          - name: build image
            run: docker build -t ${{env.IMAGE_NAME}}:v${{github.run_number}} .

          - name: tag latest image
            run: docker tag ${{env.IMAGE_NAME}}:v${{github.run_number}} ${{env.IMAGE_NAME}}:latest

          - name: check image
            run: docker images

          - name: Login to Docker Hub
            uses: docker/login-action@v4
            with:
              username: ${{ vars.DOCKERHUB_USERNAME }}
              password: ${{ secrets.DOCKERHUB_TOKEN }}

          - name: push image
            run: docker push ${{env.IMAGE_NAME}}:v${{github.run_number}}

          - name: push latest image
            run: docker push ${{env.IMAGE_NAME}}:latest

    # deploy
    deploy:
        runs-on: ubuntu-latest
        needs: build-docker-image
        steps:
          - name: Execute remote SSH commands using password
            uses: appleboy/ssh-action@v1
            with:
              host: ${{ secrets.VPS_HOST }}
              username: ${{ secrets.VPS_USERNAME }}
              password: ${{ secrets.VPS_PASSWORD }}
              script: |
                cd /home/user/devops-script/fronend
                sudo docker compose up -d --force-recreate --pull always backend-api